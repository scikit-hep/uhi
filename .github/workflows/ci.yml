name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - main

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

        include:
        - python-version: pypy-3.11
          runs-on: ubuntu-latest
        - python-version: "3.11"
          runs-on: ubuntu-latest
        - python-version: "3.12"
          runs-on: ubuntu-latest
        - python-version: "3.13"
          runs-on: ubuntu-latest
        - python-version: "3.14"
          runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Install package
      run: uv pip install --system -e.[schema] --group test

    - name: Test
      run: python -m pytest -ra

  root:
    name: ROOT test
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        use-mamba: true
        environment-file: environment.yml

    - name: Install package
      run: pip install .

    - name: Test root
      run: pytest -ra tests/test_root.py tests/test_uproot.py
