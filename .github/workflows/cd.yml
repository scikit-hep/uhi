name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
    - published
  schedule:
    - cron: "34 5 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  publish:
    name: Publish to PyPI
    needs: [dist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/uhi
    permissions:
      id-token: write  # to publish with trusted publishing
      attestations: write  # to attach build provenance
      contents: read  # to attach build provenance

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Packages
        path: dist

    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: "dist/*"

    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3


  upload_nightly_wheels:
    name: Upload nightly wheels to Anaconda Cloud
    if: |
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      !github.event.repository.fork &&
      github.ref == 'refs/heads/main'
    needs: [dist]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Packages
        path: dist

    - name: List all files
      run: ls -lh dist

    - name: Upload wheel to Anaconda Cloud as nightly
      uses: scientific-python/upload-nightly-action@16fa02eacee1655195143de09f03676e60ef2bf5 # 0.6.5
      with:
        artifacts_path: dist
        anaconda_nightly_upload_token: ${{ secrets.ANACONDA_ORG_UPLOAD_TOKEN }}
